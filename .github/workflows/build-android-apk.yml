name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/location-wrapped-native/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align Expo dependencies
        run: pnpm --dir artifacts/location-wrapped-native exec expo install --fix --pnpm

      - name: Generate native Android project
        env:
          CI: "1"
        run: pnpm --dir artifacts/location-wrapped-native exec expo prebuild --platform android --clean --no-install

      - name: Install prebuild dependency updates
        run: pnpm install --no-frozen-lockfile

      - name: Build APK
        working-directory: artifacts/location-wrapped-native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: cp artifacts/location-wrapped-native/android/app/build/outputs/apk/release/app-release.apk location-wrapped.apk

      - uses: actions/upload-artifact@v4
        with:
          name: location-wrapped-android
          path: location-wrapped.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest location-wrapped.apk --clobber
          else
            gh release create android-latest location-wrapped.apk --title "Location Wrapped Android" --notes "Latest installable APK."
          fi
